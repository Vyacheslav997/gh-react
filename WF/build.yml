name: build and deploy
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Get code
      uses: actions/checkout@v6
    - name: Install npm
      run: npm install
    - name: Build project
      run: npm run build
    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
        path: build
        name: build-files
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: get build project
        uses: actions/download-artifact@v8
        with:
          name: build-files
